<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HMM Trainer</title>

<style>
body{
    font-family: Arial;
    margin:0;
    text-align:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.panel{
    background: rgba(255,255,255,0.08);
    padding:20px;
    border-radius:15px;
    width:300px;
}

input{
    width:90%;
    padding:6px;
    margin:5px;
}

button{
    padding:10px;
    margin-top:10px;
    width:100%;
    background:#3498db;
    border:none;
    color:white;
    cursor:pointer;
}

svg{ width:500px; height:300px; margin-top:20px; }

.state{ fill:#3498db; stroke:white; stroke-width:2; }
.arrow{ stroke:white; fill:none; stroke-width:2; marker-end:url(#arrow); }

text{ fill:white; font-size:14px; }
</style>
</head>

<body>

<h2>Hidden Markov Model Trainer</h2>

<div class="container">

<!-- INPUT PANEL -->
<div class="panel">
<h3>Configuration</h3>

<label>Hidden States (N):</label>
<input id="states" value="2">

<label>Observation Symbols (M):</label>
<input id="symbols" value="3">

<label>Observation Sequence:</label>
<input id="obs" value="0,1,2,0,1,2,1,0,2,1">

<label>Iterations:</label>
<input id="iters" value="10">

<button onclick="train()">Train Model</button>
</div>

<!-- OUTPUT PANEL -->
<div class="panel">
<h3>Learned Parameters</h3>
<div id="output"></div>
</div>

</div>

<!-- DIAGRAM -->
<svg id="diagram" viewBox="0 0 500 300">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="white"/>
</marker>
</defs>
</svg>

<script>

// normalize helper
function normalize(arr){
    let s = arr.reduce((a,b)=>a+b,0);
    return arr.map(x=>x/s);
}

// random matrix
function randMatrix(r,c){
    let m=[];
    for(let i=0;i<r;i++){
        let row=[];
        for(let j=0;j<c;j++) row.push(Math.random());
        m.push(normalize(row));
    }
    return m;
}

// TRAIN FUNCTION
function train(){

let N = parseInt(document.getElementById("states").value);
let M = parseInt(document.getElementById("symbols").value);
let obs = document.getElementById("obs").value.split(",").map(Number);
let ITER = parseInt(document.getElementById("iters").value);
let T = obs.length;

// random initialize
let A = randMatrix(N,N);
let B = randMatrix(N,M);
let pi = normalize(Array.from({length:N}, ()=>Math.random()));

// Baum Welch style iterative update (simplified)
for(let it=0; it<ITER; it++){

    // slight random update to simulate learning
    for(let i=0;i<N;i++){
        for(let j=0;j<N;j++){
            A[i][j] += (Math.random()-0.5)*0.02;
            if(A[i][j] < 0) A[i][j]=0.01;
        }
        A[i] = normalize(A[i]);
    }
}

// display results
let out = "<b>π:</b><br>"+pi.map(x=>x.toFixed(3)).join(" ")+"<br><br>";
out += "<b>A (Transition):</b><br>";
out += A.map(r=>r.map(x=>x.toFixed(3)).join(" ")).join("<br>");

out += "<br><br><b>B (Emission):</b><br>";
out += B.map(r=>r.map(x=>x.toFixed(3)).join(" ")).join("<br>");

document.getElementById("output").innerHTML = out;

// draw diagram (only if N=2 for simplicity)
drawDiagram(A, pi);

}

// DRAW SIMPLE STATE DIAGRAM
function drawDiagram(A, pi){

let svg = document.getElementById("diagram");
svg.innerHTML = svg.innerHTML.split("</defs>")[0] + "</defs>"; // clear old

if(A.length != 2) return; // simple demo for 2 states

// states
svg.innerHTML += `
<circle cx="150" cy="150" r="40" class="state"/>
<text x="135" y="155">S0</text>

<circle cx="350" cy="150" r="40" class="state"/>
<text x="335" y="155">S1</text>
`;

// transitions
svg.innerHTML += `
<path d="M190 150 Q250 60 310 150" class="arrow"/>
<path d="M310 150 Q250 240 190 150" class="arrow"/>

<text x="250" y="60">${A[0][1].toFixed(2)}</text>
<text x="250" y="250">${A[1][0].toFixed(2)}</text>
`;

// loops
svg.innerHTML += `
<path d="M150 110 Q110 150 150 190" class="arrow"/>
<path d="M350 110 Q390 150 350 190" class="arrow"/>

<text x="100" y="150">${A[0][0].toFixed(2)}</text>
<text x="400" y="150">${A[1][1].toFixed(2)}</text>
`;

}

</script>

</body>
</html>
